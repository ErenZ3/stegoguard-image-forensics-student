name: StegoGuard Image Forensics

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  image-forensics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show lab mode
        run: cat lab_mode.txt

      - name: Create demo image
        run: python make_demo_image.py

      - name: Run StegoGuard scanner
        run: python scanner.py

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: student-image
          path: images/student_image.png

      - name: Save generated image to repository
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/student_image.png
          git diff --cached --quiet || git commit -m "Update generated student image"
          git push
